<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronomètre</title>
<style>
  :root {
    --bg: #16181d;
    --panel: #1f232b;
    --digit: #ff9f1c;
    --digit-dim: #4a3417;
    --start: #2dd4a7;
    --stop: #ff5470;
    --neutral: #3a3f4a;
    --text: #cfd3da;
    --text-dim: #6b7280;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    padding: 24px;
  }

  .device {
    background: var(--panel);
    border-radius: 20px;
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
  }

  .label {
    text-align: center;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 18px;
  }

  .display {
    text-align: center;
    font-family: "Courier New", monospace;
    font-size: 56px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--digit-dim);
    text-shadow: none;
    transition: color 0.15s, text-shadow 0.15s;
    margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
  }

  .display.running {
    color: var(--digit);
    text-shadow: 0 0 18px rgba(255, 159, 28, 0.55);
  }

  .ms {
    font-size: 24px;
    opacity: 0.7;
  }

  .status {
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 28px;
    height: 16px;
  }

  .status.live { color: var(--start); }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }

  button {
    border: none;
    border-radius: 12px;
    padding: 16px 0;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    color: white;
    transition: transform 0.08s, filter 0.15s;
    font-family: inherit;
  }

  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button:not(:disabled):hover { filter: brightness(1.1); }

  #startBtn { background: var(--start); }
  #stopBtn { background: var(--stop); }
  #lapBtn { background: var(--neutral); grid-column: span 1; }
  #resetBtn { background: var(--neutral); grid-column: span 1; }

  .laps {
    max-height: 160px;
    overflow-y: auto;
    border-top: 1px solid rgba(255,255,255,0.08);
    padding-top: 12px;
  }

  .laps:empty { display: none; }

  .lap-row {
    display: flex;
    justify-content: space-between;
    font-family: "Courier New", monospace;
    font-size: 13px;
    padding: 6px 4px;
    color: var(--text-dim);
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }

  .lap-row span:first-child { color: var(--text); }

  .laps::-webkit-scrollbar { width: 6px; }
  .laps::-webkit-scrollbar-thumb { background: var(--neutral); border-radius: 3px; }
</style>
</head>
<body>

<div class="device">
  <div class="label">Chronomètre</div>
  <div class="display" id="display">00:00<span class="ms">.00</span></div>
  <div class="status" id="status"></div>

  <div class="controls">
    <button id="startBtn">Démarrer</button>
    <button id="stopBtn" disabled>Arrêter</button>
    <button id="lapBtn" disabled>Tour</button>
    <button id="resetBtn" disabled>Réinitialiser</button>
  </div>

  <div class="laps" id="laps"></div>
</div>

<script>
  const display = document.getElementById('display');
  const status = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const lapBtn = document.getElementById('lapBtn');
  const resetBtn = document.getElementById('resetBtn');
  const lapsEl = document.getElementById('laps');

  let startTime = 0;
  let elapsed = 0;
  let timerId = null;
  let lapCount = 0;

  function format(ms) {
    const totalCs = Math.floor(ms / 10);
    const cs = totalCs % 100;
    const totalSec = Math.floor(totalCs / 100);
    const sec = totalSec % 60;
    const min = Math.floor(totalSec / 60);
    const pad = (n, l = 2) => String(n).padStart(l, '0');
    return { main: `${pad(min)}:${pad(sec)}`, ms: pad(cs) };
  }

  function render() {
    const now = elapsed + (timerId ? performance.now() - startTime : 0);
    const { main, ms } = format(now);
    display.innerHTML = `${main}<span class="ms">.${ms}</span>`;
  }

  function tick() {
    render();
    timerId = requestAnimationFrame(tick);
  }

  startBtn.addEventListener('click', () => {
    startTime = performance.now();
    timerId = requestAnimationFrame(tick);
    display.classList.add('running');
    status.textContent = 'En cours';
    status.classList.add('live');
    startBtn.disabled = true;
    stopBtn.disabled = false;
    lapBtn.disabled = false;
    resetBtn.disabled = true;
  });

  stopBtn.addEventListener('click', () => {
    cancelAnimationFrame(timerId);
    elapsed += performance.now() - startTime;
    timerId = null;
    display.classList.remove('running');
    status.textContent = 'En pause';
    status.classList.remove('live');
    startBtn.disabled = false;
    startBtn.textContent = 'Reprendre';
    stopBtn.disabled = true;
    lapBtn.disabled = true;
    resetBtn.disabled = false;
  });

  lapBtn.addEventListener('click', () => {
    lapCount++;
    const now = elapsed + (performance.now() - startTime);
    const { main, ms } = format(now);
    const row = document.createElement('div');
    row.className = 'lap-row';
    row.innerHTML = `<span>Tour ${lapCount}</span><span>${main}.${ms}</span>`;
    lapsEl.prepend(row);
  });

  resetBtn.addEventListener('click', () => {
    elapsed = 0;
    lapCount = 0;
    lapsEl.innerHTML = '';
    display.innerHTML = '00:00<span class="ms">.00</span>';
    status.textContent = '';
    startBtn.textContent = 'Démarrer';
    startBtn.disabled = false;
    stopBtn.disabled = true;
    lapBtn.disabled = true;
    resetBtn.disabled = true;
  });
</script>

</body>
</html>
