<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><!-- Encodage UTF-8 pour les caractères accentués -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><!-- Réglages pour mobile / responsive, empêche le zoom (user-scalable=no) -->
<title>Chronomètre</title><!-- Titre de l'onglet -->

<!-- PWA -->
<link rel="manifest" href="manifest.json"><!-- Fichier manifest pour PWA -->
<meta name="theme-color" content="#16181d"><!-- Couleur du thème pour navigateurs / barre d'adresse -->
<link rel="icon" href="icon-192.png"><!-- Icône du site -->

<!-- iOS -->
<meta name="apple-mobile-web-app-capable" content="yes"><!-- Permet l'ajout en plein écran sur iOS -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><!-- Style de la barre de statut iOS -->
<meta name="apple-mobile-web-app-title" content="Chrono"><!-- Nom affiché sur l'écran d'accueil iOS -->
<link rel="apple-touch-icon" href="icon-192.png"><!-- Icône iOS -->

<style>
  /* Variables de thème réutilisables */
  :root {
    --bg: #16181d;
    --panel: #1f232b;
    --digit: #ff9f1c;
    --digit-dim: #4a3417;
    --start: #2dd4a7;
    --stop: #ff5470;
    --neutral: #3a3f4a;
    --text: #cfd3da;
    --text-dim: #6b7280;
  }

  * { box-sizing: border-box; } /* Box sizing global */

  html, body {
    height: 100%;
    overscroll-behavior: none; /* Prévenir rebonds de scroll sur mobile */
  }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh; /* Support des unités dynamiques sur mobile */
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); /* Respect des safe areas (notch) */
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  /* Conteneur principal représentant l'appareil / panneau */
  .device {
    background: var(--panel);
    border-radius: 20px;
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
  }

  .label {
    text-align: center;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 18px;
  }

  /* Affichage du chronomètre (heures:minutes) - police monospace pour alignement */
  .display {
    text-align: center;
    font-family: "Courier New", monospace;
    font-size: 56px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--digit-dim);
    text-shadow: none;
    transition: color 0.15s, text-shadow 0.15s;
    margin-bottom: 8px;
    font-variant-numeric: tabular-nums; /* chiffres à largeur fixe */
  }

  .display.running {
    color: var(--digit); /* Couleur et halo quand en cours */
    text-shadow: 0 0 18px rgba(255, 159, 28, 0.55);
  }

  .ms {
    font-size: 24px;
    opacity: 0.7; /* Millisecondes légèrement atténuées */
  }

  .status {
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 28px;
    height: 16px; /* Réserve d'espace pour le statut (En cours / En pause) */
  }

  .status.live { color: var(--start); } /* Couleur quand actif */

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }

  /* Styles généraux des boutons */
  button {
    border: none;
    border-radius: 12px;
    padding: 16px 0;
    min-height: 52px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    color: white;
    transition: transform 0.08s, filter 0.15s;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }

  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button:not(:disabled):hover { filter: brightness(1.1); }

  /* Boutons spécifiques */
  #startBtn { background: var(--start); }
  #stopBtn { background: var(--stop); }
  #lapBtn { background: var(--neutral); grid-column: span 1; }
  #resetBtn { background: var(--neutral); grid-column: span 1; }

  /* Liste des tours */
  .laps {
    max-height: 160px;
    overflow-y: auto;
    border-top: 1px solid rgba(255,255,255,0.08);
    padding-top: 12px;
  }

  .laps:empty { display: none; } /* Masquer si vide */

  .lap-row {
    display: flex;
    justify-content: space-between;
    font-family: "Courier New", monospace;
    font-size: 13px;
    padding: 6px 4px;
    color: var(--text-dim);
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }

  .lap-row span:first-child { color: var(--text); } /* Le label (Tour n) plus visible */

  .laps::-webkit-scrollbar { width: 6px; }
  .laps::-webkit-scrollbar-thumb { background: var(--neutral); border-radius: 3px; }

  @media (max-width: 360px) {
    .device { padding: 28px 22px; }
    .display { font-size: 44px; }
    .ms { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="device">
  <!-- Titre / label de l'app -->
  <div class="label">Chronomètre</div>

  <!-- Affichage principal du temps; l'ID est utilisé par le script pour mettre à jour -->
  <div class="display" id="display">00:00<span class="ms">.00</span></div>

  <!-- Zone de statut: vide par défaut, mise à jour par le script -->
  <div class="status" id="status"></div>

  <!-- Contrôles (Démarrer / Arrêter / Tour / Réinitialiser) -->
  <div class="controls">
    <button id="startBtn">Démarrer</button><!-- Démarre ou reprend le chronomètre -->
    <button id="stopBtn" disabled>Arrêter</button><!-- Arrête / met en pause -->
    <button id="lapBtn" disabled>Tour</button><!-- Enregistre un tour (lap) -->
    <button id="resetBtn" disabled>Réinitialiser</button><!-- Remet à zéro -->
  </div>

  <!-- Conteneur des tours enregistrés; rempli dynamiquement -->
  <div class="laps" id="laps"></div>
</div>

<script>
  // Récupération des éléments du DOM
  const display = document.getElementById('display');
  const status = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const lapBtn = document.getElementById('lapBtn');
  const resetBtn = document.getElementById('resetBtn');
  const lapsEl = document.getElementById('laps');

  // Variables de l'état du chronomètre
  let startTime = 0;   // timestamp quand le chrono a été (re)démarré (performance.now)
  let elapsed = 0;     // temps accumulé en ms lors des pauses
  let timerId = null;  // identifiant du requestAnimationFrame quand en cours
  let lapCount = 0;    // compteur de tours

  // Formatteur: convertit des millisecondes en { main: "MM:SS", ms: "CS" }
  // Note: la précision affichée est en centièmes (cs = centièmes de seconde)
  function format(ms) {
    const totalCs = Math.floor(ms / 10); // centièmes de seconde
    const cs = totalCs % 100;
    const totalSec = Math.floor(totalCs / 100);
    const sec = totalSec % 60;
    const min = Math.floor(totalSec / 60);
    const pad = (n, l = 2) => String(n).padStart(l, '0');
    return { main: `${pad(min)}:${pad(sec)}`, ms: pad(cs) };
  }

  // Met à jour l'affichage en lisant le temps courant
  function render() {
    // Si timerId est actif, on calcule le temps courant (elapsed + delta depuis startTime)
    const now = elapsed + (timerId ? performance.now() - startTime : 0);
    const { main, ms } = format(now);
    display.innerHTML = `${main}<span class="ms">.${ms}</span>`; // mise à jour HTML
  }

  // Boucle d'animation / mise à jour continue via requestAnimationFrame
  function tick() {
    render();
    timerId = requestAnimationFrame(tick);
  }

  // Événement: clic sur "Démarrer" / "Reprendre"
  startBtn.addEventListener('click', () => {
    startTime = performance.now(); // point de départ pour ce segment
    timerId = requestAnimationFrame(tick); // lance la boucle
    display.classList.add('running'); // style visuel "en cours"
    status.textContent = 'En cours';
    status.classList.add('live');
    startBtn.disabled = true;
    stopBtn.disabled = false;
    lapBtn.disabled = false;
    resetBtn.disabled = true; // reset non disponible pendant la course
  });

  // Événement: clic sur "Arrêter" (met en pause)
  stopBtn.addEventListener('click', () => {
    cancelAnimationFrame(timerId); // stop boucle
    elapsed += performance.now() - startTime; // accumule la durée du segment en cours
    timerId = null;
    display.classList.remove('running');
    status.textContent = 'En pause';
    status.classList.remove('live');
    startBtn.disabled = false;
    startBtn.textContent = 'Reprendre'; // changer le libellé pour reprendre
    stopBtn.disabled = true;
    lapBtn.disabled = true;
    resetBtn.disabled = false; // autoriser la réinitialisation quand en pause
  });

  // Événement: clic sur "Tour" (enregistre un laps)
  lapBtn.addEventListener('click', () => {
    lapCount++;
    const now = elapsed + (performance.now() - startTime); // temps courant total
    const { main, ms } = format(now);
    const row = document.createElement('div');
    row.className = 'lap-row';
    row.innerHTML = `<span>Tour ${lapCount}</span><span>${main}.${ms}</span>`; // format "Tour N  MM:SS.CS"
    lapsEl.prepend(row); // ajoute en haut de la liste
  });

  // Événement: clic sur "Réinitialiser" (remet tout à zéro)
  resetBtn.addEventListener('click', () => {
    elapsed = 0;
    lapCount = 0;
    lapsEl.innerHTML = ''; // vide la liste des tours
    display.innerHTML = '00:00<span class="ms">.00</span>'; // affichage par défaut
    status.textContent = '';
    startBtn.textContent = 'Démarrer'; // remettre le libellé initial
    startBtn.disabled = false;
    stopBtn.disabled = true;
    lapBtn.disabled = true;
    resetBtn.disabled = true;
  });

  // Enregistrement du service worker si supporté (pour PWA / offline)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {}); // erreur silencieuse si échec
    });
  }
</script>

</body>
</html>
